<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Status Indicator Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    padding: 24px;
  }
  h1 { font-size: 20px; color: #303133; margin-bottom: 24px; }
  .demo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
  }
  .demo-card {
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e4e7ed;
    overflow: hidden;
  }
  .demo-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #303133;
    border-bottom: 1px solid #e4e7ed;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .demo-header .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }
  .tag-recommended { background: #ecf5ff; color: #409eff; }
  .tag-alt { background: #f4f4f5; color: #909399; }
  .demo-body { padding: 8px 0; }
  .tree-item {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 8px;
    transition: background 0.15s;
  }
  .tree-item:hover { background: #f5f7fa; }
  .tree-item.selected { background: #ecf5ff; }
  .tree-icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
  }
  .tree-label {
    font-size: 14px;
    color: #303133;
    flex: 1;
  }
  .tree-item.selected .tree-label { color: #409eff; }

  /* ===== Plan A: Enhanced Dot ===== */
  .dot-enhanced {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }
  .dot-enhanced.enabled {
    background: #67c23a;
    box-shadow: 0 0 0 2px rgba(103, 194, 58, 0.2), 0 0 6px rgba(103, 194, 58, 0.4);
  }
  .dot-enhanced.disabled {
    background: #c0c4cc;
    box-shadow: 0 0 0 2px rgba(192, 196, 204, 0.2);
  }

  /* ===== Plan B: Icon ===== */
  .icon-status {
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
    width: 16px;
    text-align: center;
  }
  .icon-status.enabled { color: #67c23a; }
  .icon-status.disabled { color: #c0c4cc; }

  /* ===== Plan C: Mini Badge ===== */
  .mini-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .mini-badge.enabled {
    background: #f0f9eb;
    color: #67c23a;
    border: 1px solid #e1f3d8;
  }
  .mini-badge.disabled {
    background: #f4f4f5;
    color: #909399;
    border: 1px solid #e9e9eb;
  }

  /* ===== Plan D: Left Bar ===== */
  .bar-item {
    position: relative;
    padding-left: 20px;
  }
  .bar-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    border-radius: 2px;
  }
  .bar-item.enabled::before { background: #67c23a; }
  .bar-item.disabled::before { background: #dcdfe6; }

  /* ===== Original for comparison ===== */
  .dot-original {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-original.enabled {
    background: #67c23a;
    box-shadow: 0 0 4px rgba(103, 194, 58, 0.3);
  }
  .dot-original.disabled { background: #c0c4cc; }

  .section-title {
    font-size: 13px;
    color: #909399;
    margin: 20px 0 12px;
    max-width: 900px;
  }
</style>
</head>
<body>

<h1>Status Indicator 方案对比</h1>

<div class="demo-grid">

  <!-- Original -->
  <div class="demo-card">
    <div class="demo-header">
      Original（当前）
      <span class="tag tag-alt">可视性差</span>
    </div>
    <div class="demo-body">
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Can</span>
        <span class="dot-original enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Gpt</span>
        <span class="dot-original enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Mcu</span>
        <span class="dot-original enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Port</span>
        <span class="dot-original disabled"></span>
      </div>
    </div>
  </div>

  <!-- Plan A: Enhanced Dot -->
  <div class="demo-card">
    <div class="demo-header">
      A: Enhanced Dot
      <span class="tag tag-recommended">推荐</span>
    </div>
    <div class="demo-body">
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Can</span>
        <span class="dot-enhanced enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Gpt</span>
        <span class="dot-enhanced enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Mcu</span>
        <span class="dot-enhanced enabled"></span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Port</span>
        <span class="dot-enhanced disabled"></span>
      </div>
    </div>
  </div>

  <!-- Plan B: Icon -->
  <div class="demo-card">
    <div class="demo-header">
      B: Icon Check/Dash
      <span class="tag tag-alt">直观</span>
    </div>
    <div class="demo-body">
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Can</span>
        <span class="icon-status enabled">&#10003;</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Gpt</span>
        <span class="icon-status enabled">&#10003;</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Mcu</span>
        <span class="icon-status enabled">&#10003;</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Port</span>
        <span class="icon-status disabled">&#8212;</span>
      </div>
    </div>
  </div>

  <!-- Plan C: Mini Badge -->
  <div class="demo-card">
    <div class="demo-header">
      C: Mini Badge
      <span class="tag tag-alt">最清晰</span>
    </div>
    <div class="demo-body">
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Can</span>
        <span class="mini-badge enabled">ON</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Gpt</span>
        <span class="mini-badge enabled">ON</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Mcu</span>
        <span class="mini-badge enabled">ON</span>
      </div>
      <div class="tree-item">
        <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span class="tree-label">Port</span>
        <span class="mini-badge disabled">OFF</span>
      </div>
    </div>
  </div>

</div>

<p class="section-title">D: Left Bar — 左侧色条（不占右侧空间）</p>
<div class="demo-card" style="max-width: 440px;">
  <div class="demo-header">
    D: Left Color Bar
    <span class="tag tag-alt">VS Code 风格</span>
  </div>
  <div class="demo-body">
    <div class="tree-item bar-item enabled">
      <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
      <span class="tree-label">Can</span>
    </div>
    <div class="tree-item bar-item enabled">
      <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
      <span class="tree-label">Gpt</span>
    </div>
    <div class="tree-item bar-item enabled">
      <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
      <span class="tree-label">Mcu</span>
    </div>
    <div class="tree-item bar-item disabled">
      <svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="#409eff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
      <span class="tree-label">Port</span>
    </div>
  </div>
</div>

</body>
</html>
