[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuleasr-configurator"
version = "1.0.0"
description = "yuleASR-Configurator: Unified AUTOSAR BSW configuration tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "YuleTech", email = "dev@yuletech.com"}]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.17",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Required by fastapi.testclient (Starlette TestClient) used in tests/.
    "httpx>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
yuleasr = "yuleasr.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["yuleasr*"]
