  # Most rule numbers unchanged; exceptions noted in comments.
  # Baseline (2026-08-07 rebuild): 36212 total (required 14494 / advisory 20528 / unknown 1190)
  #   — density 119.4/kloc over 757 files; top required: 17.7(4339), 10.4(1988), 12.1(1389),
  #     11.9(1179), 8.4(682), 20.1(674), 17.3(576), 14.4(547)  → 机械性规则已登记 deviation。
