# yuleASR CI Configuration
# ─────────────────────────────────────
# AUTOSAR BSW 平台 CI 流水线配置

ci:
  layers: [1, 2, 3]
  layer_dependencies:
    1: []
    2: [1]
    3: [1, 2]
  layer1_timeout: 180          # seconds; overridable via CI_LAYER1_TIMEOUT env

coverage:
  threshold_line: 85.0
  threshold_condition: 85.0
  c_fail_under: 85
  strict: false
  threshold_branch: 60.0
  module_thresholds:
    src/ecual: 75.0
    src/mcal: 75.0
    src/services: 80.0

misra:
  enabled: true
  addon: "misra"
  active_profile: "safety"
  fail_on_required: false        # Phase 1: 临时关闭，承认基线
  fail_on_advisory: false
  fail_threshold: 13000           # Phase 1: 11923 total (0 R/0 A + 11923 style), set above baseline
  violations_per_kloc: 150.0      # Phase 1: 实际密度 95.9/KLOC，留余量
  cppcheck_std: "c11"
  rule_texts_path: ".yuleosh/misra_texts.txt"     # P1.5-B: 提供MISRA规则文本，消除"use --rule-texts"信息
  exclude_paths:
    - "tests/**"
    - "third_party/**"
    - "build/**"
    - "Drivers/**"
    - "Middlewares/**"
    - "CMSIS/**"
  code_categories:
    template:
      paths: ["src/yuleosh/templates/**"]
      action: exclude
      block_on: false
    third_party:
      paths: ["third_party/**", "Drivers/**", "Middlewares/**", "CMSIS/**", "vendor/**"]
      action: alert
      block_on: false
    business:
      paths: ["src/**"]
      action: enforce
      block_on: false
  profiles:
    safety:
      name: "safety"
      deviations:
        - id: "DP-AUTOSAR-001"
          rule: "misra-c2012-15.5"
          scope: "src/**"
          reason: "AUTOSAR BSW error handling multiple-return pattern"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-002"
          rule: "misra-c2012-17.7"
          scope: "src/**/det*"
          reason: "DET/TRACE diagnostic call return value intentionally unused"
          expiry: "2027-01-21"
        - id: "DP-AUTOSAR-003"
          rule: "misra-c2012-2.5"
          scope: "src/**"
          reason: "AUTOSAR R21-11 §7.2 include guard naming (_MODULE_H_ convention)"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-004"
          rule: "misra-c2012-10.1"
          scope: "src/**/cfg/*"
          reason: "AUTOSAR config macro boolean flag pattern (STD_ON/STD_OFF)"
          expiry: "2027-01-21"
        - id: "DP-AUTOSAR-005"
          rule: "misra-c2012-14.4"
          scope: "src/**"
          reason: "AUTOSAR config enum switch-case complete coverage, no default needed"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-006"
          rule: "misra-c2012-8.13"
          scope: "src/bsw/services/pdur/**"
          reason: "PduR API signature compatibility (non-const pointer interface)"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-007"
          rule: "misra-c2012-11.4"
          scope: "src/bsw/services/ramsafety/**;src/bsw/mcal/**"
          reason: "Hardware register access and RamSafety address mapping"
          expiry: "2027-07-21"
      advisory_violations:
        - rule: "misra-c2012-15.5"
          reason: "accepted pattern - see DP-AUTOSAR-001"
        - rule: "misra-c2012-17.7"
          reason: "accepted pattern - see DP-AUTOSAR-002"
        - rule: "misra-c2012-8.13"
          reason: "accepted pattern - see DP-AUTOSAR-006"
      deviation_expiry_days: 180
    testing:
      name: "testing"
      rule_overrides:
        - rule: "misra-c2023-21.3"
          enabled: false
      deviations: []
hardware_test:
  enabled: false
  mock: true
  firmware: "build-native/firmware.elf"
  boot_pattern: "Boot Complete"
  flash_tool: "auto"
  serial_port: ""
  baud: 115200
  test_timeout: 30
  boot_delay: 2.0
  test_scripts_dir: "tests/hil"
