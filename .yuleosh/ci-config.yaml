# yuleASR CI Configuration — MISRA C:2023
# ─────────────────────────────────────
# AUTOSAR BSW 平台 CI 流水线配置
# Migration: MISRA C:2012 → C:2023 (2026-07-28)
# Baseline scan: 2026-07-22, 3266 total violations (369 required, 1020 advisory)
# Work Package: WP1 (yuleASR-enhancement-plan.md)

ci:
  layers: [1, 2, 3]
  layer_dependencies:
    1: []
    2: [1]
    3: [1, 2]
  layer1_timeout: 180          # seconds; overridable via CI_LAYER1_TIMEOUT env

coverage:
  # ── 门禁阈值 ──────────────────────────────────────────────
  #
  # Phase 2 目标 (当前):
  #   threshold_line:   20.0%  整体行覆盖率最低目标
  #   c_fail_under:     35.0%  硬门禁 — CI pipeline 阻断线
  #   strict:           false  门禁为 advisory 模式 (开发期)
  #
  # Phase 3 目标 (未来):
  #   strict: true, c_fail_under: 60%
  #
  threshold_line: 20.0
  threshold_condition: 10.0
  c_fail_under: 35
  strict: false
  threshold_branch: 10.0

  # ── 模块级门禁阈值 ──────────────────────────────────────────
  #  每个模块的独立行覆盖率门禁
  module_thresholds:
    src/ecual: 35.0
    src/mcal: 35.0
    src/services: 35.0

  # ── ASIL B 模块分支覆盖率门禁 (ISO 26262-6 §9.2) ───────────
  #  Phase 3 时启用
  module_thresholds_branch:
    src/bsw/services/e2e: 60.0
    src/bsw/services/wdgm: 60.0
    src/bsw/services/nvm: 60.0
    src/bsw/services/cryif: 60.0
    src/bsw/services/secoc: 60.0
    src/bsw/services/ramsafety: 60.0

misra:
  enabled: true
  ruleset: "misra-c2023"
  addon: "misra"
  active_profile: "safety"
  advisory_violations: 20528        # MISRA C:2023 baseline advisory (2026-08-07 重建: 36212 total)
  fail_on_required: false          # Phase 1: migration — allow baseline
  fail_on_advisory: false
  fail_threshold: 37000            # 2026-08-07 重建基线: 真实 36212 (business 36106) + 余量
  violations_per_kloc: 200.0       # 2026-08-07 重建基线: 真实密度 188.2/KLOC, with margin
  cppcheck_std: "c11"
  rule_texts_path: ".yuleosh/misra_c2023_texts.txt"    # P1.5-B: C:2023 rule texts
  # ── MISRA C:2023 Deviations ──────────────────────────────────────────
  # ISO 26262-8 §9 偏差批准记录：
  #   approved_by: Safety Manager（安全经理批准）
  #   status: approved（已批准生效）
  #   expiry: 2027-12-31（到期需复审；与 safety profile 偏差一致）

