# yuleASR CI Configuration
# ─────────────────────────────────────
# AUTOSAR BSW 平台 CI 流水线配置

ci:
  layers: [1, 2, 3]
  layer_dependencies:
    1: []
    2: [1]
    3: [1, 2]
  layer1_timeout: 180          # seconds; overridable via CI_LAYER1_TIMEOUT env

coverage:
  threshold_line: 35.0
  threshold_condition: 10.0
  c_fail_under: 35
  strict: false
  threshold_branch: 60.0
  module_thresholds:
    src/ecual: 35.0
    src/mcal: 35.0
    src/services: 35.0

misra:
  enabled: true
  addon: "misra"
  active_profile: "safety"
  fail_on_required: false        # Phase 1: 临时关闭，承认基线
  fail_on_advisory: false
  fail_threshold: 13000           # Phase 1: 11923 total (0 R/0 A + 11923 style), set above baseline
  violations_per_kloc: 150.0      # Phase 1: 实际密度 95.9/KLOC，留余量
  cppcheck_std: "c11"
  rule_texts_path: ".yuleosh/misra_texts.txt"     # P1.5-B: 提供MISRA规则文本，消除"use --rule-texts"信息
  deviations:
    - rule: "misra-c2012-20.9"
      file: "src/**"
      reason: "AUTOSAR R21-11 §8.4 — #if defined() required for config switches"
    - rule: "misra-c2012-7.2"
      file: "src/**"
      reason: "AUTOSAR embedded unsigned/signed comparison (Std_ReturnType + uint32)"
    - rule: "misra-c2012-5.8"
      file: "src/**"
      reason: "AUTOSAR BSW config struct naming convention overlaps across modules"
    - rule: "misra-c2012-15.7"
      file: "src/**"
      reason: "AUTOSAR switch-case complete coverage; no else needed"
    - rule: "misra-c2012-2.7"
      file: "src/**"
      reason: "AUTOSAR BSW API signature uniformity requires unused params"
    - rule: "misra-c2012-15.6"
      file: "src/**"
      reason: "AUTOSAR error-handling nested if/else required for DET traceability"
    - rule: "misra-c2012-11.5"
      file: "src/bsw/mcal/**"
      reason: "Hardware register and memory-mapped I/O void* conversion"
    - rule: "misra-c2012-8.8"
      file: "src/**"
      reason: "AUTOSAR BSW inter-module API external linkage"
    - rule: "misra-c2012-5.7"
      file: "src/**"
      reason: "AUTOSAR config type tag naming per module"
    - rule: "misra-c2012-10.8"
      file: "src/**"
      reason: "AUTOSAR integer casting for Std_ReturnType and module IDs"
  exclude_paths:
    - "tests/**"
    - "src/**/*_test.c"
    - "src/**/*_test.h"
    - "src/**/legacy/**"
    - "third_party/**"
    - "build/**"
    - "Drivers/**"
    - "Middlewares/**"
    - "CMSIS/**"
  code_categories:
    template:
      paths: ["src/yuleosh/templates/**"]
      action: exclude
      block_on: false
    third_party:
      paths: ["third_party/**", "Drivers/**", "Middlewares/**", "CMSIS/**", "vendor/**"]
      action: alert
      block_on: false
    business:
      paths: ["src/**"]
      action: enforce
      block_on: false
  profiles:
    safety:
      name: "safety"
      deviations:
        - id: "DP-AUTOSAR-001"
          rule: "misra-c2012-15.5"
          scope: "src/**"
          reason: "AUTOSAR BSW error handling multiple-return pattern"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-002"
          rule: "misra-c2012-17.7"
          scope: "src/**/det*"
          reason: "DET/TRACE diagnostic call return value intentionally unused"
          expiry: "2027-01-21"
        - id: "DP-AUTOSAR-003"
          rule: "misra-c2012-2.5"
          scope: "src/**"
          reason: "AUTOSAR R21-11 §7.2 include guard naming (_MODULE_H_ convention)"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-004"
          rule: "misra-c2012-10.1"
          scope: "src/**/cfg/*"
          reason: "AUTOSAR config macro boolean flag pattern (STD_ON/STD_OFF)"
          expiry: "2027-01-21"
        - id: "DP-AUTOSAR-005"
          rule: "misra-c2012-14.4"
          scope: "src/**"
          reason: "AUTOSAR config enum switch-case complete coverage, no default needed"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-006"
          rule: "misra-c2012-8.13"
          scope: "src/bsw/services/pdur/**"
          reason: "PduR API signature compatibility (non-const pointer interface)"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-007"
          rule: "misra-c2012-11.4"
          scope: "src/bsw/services/ramsafety/**;src/bsw/mcal/**"
          reason: "Hardware register access and RamSafety address mapping"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-008"
          rule: "misra-c2012-15.1"
          scope: "src/bsw/mcal/crypto/src/Crypto_MbedTLS.c;src/bsw/boot/src/Boot_Loader.c;src/bsw/services/mqtt/src/Mqtt_Tls.c"
          reason: "goto cleanup/fail for error handling in crypto/bootloader/TLS contexts"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-009"
          rule: "misra-c2012-19.2"
          scope: "src/bsw/mcal/wdg/include/Wdg_Hw.h;src/bsw/services/dem/legacy/**;src/bsw/services/dcm/legacy/**;src/bsw/services/wdgm/include/WdgM.h;src/micro-dds/src/serialization/cdr.c"
          reason: "Union for hardware register mapping, legacy type polymorphism, and serialization"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-010"
          rule: "misra-c2012-20.9"
          scope: "src/**"
          reason: "AUTOSAR R21-11 §8.4 requires #if defined() for config switches; intentional deviation from MISRA C:2012 Rule 20.9"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-011"
          rule: "misra-c2012-7.2"
          scope: "src/**"
          reason: "AUTOSAR embedded code mixes unsigned counters with signed Std_ReturnType; intentional per AUTOSAR_SWS_PlatformTypes.pdf"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-012"
          rule: "misra-c2012-5.8"
          scope: "src/**"
          reason: "AUTOSAR BSW config struct naming convention overlaps across modules; unique per module scope"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-013"
          rule: "misra-c2012-15.7"
          scope: "src/**"
          reason: "AUTOSAR switch-case complete coverage pattern; no else needed as all cases handled"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-014"
          rule: "misra-c2012-2.7"
          scope: "src/**"
          reason: "AUTOSAR BSW function signature compatibility requires unused params for API uniformity"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-015"
          rule: "misra-c2012-15.6"
          scope: "src/**"
          reason: "AUTOSAR error-handling nested if/else pattern; any depth required for DET traceability"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-016"
          rule: "misra-c2012-11.5"
          scope: "src/bsw/mcal/**;src/bsw/services/ramsafety/**;src/platform/**"
          reason: "AUTOSAR hardware register and memory-mapped I/O requires void pointer conversion"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-017"
          rule: "misra-c2012-8.8"
          scope: "src/**"
          reason: "AUTOSAR BSW inter-module API requires external linkage for service functions"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-018"
          rule: "misra-c2012-5.7"
          scope: "src/**"
          reason: "AUTOSAR AUTOSAR config type tag naming per module; tags unique within translation unit"
          expiry: "2027-07-21"
        - id: "DP-AUTOSAR-019"
          rule: "misra-c2012-10.8"
          scope: "src/**"
          reason: "AUTOSAR integer type safe casting for Std_ReturnType and module IDs"
          expiry: "2027-07-21"
      advisory_violations:
        - rule: "misra-c2012-15.5"
          reason: "accepted pattern - see DP-AUTOSAR-001"
        - rule: "misra-c2012-17.7"
          reason: "accepted pattern - see DP-AUTOSAR-002"
        - rule: "misra-c2012-8.13"
          reason: "accepted pattern - see DP-AUTOSAR-006"
        - rule: "misra-c2012-15.1"
          reason: "accepted pattern - see DP-AUTOSAR-008"
        - rule: "misra-c2012-19.2"
          reason: "accepted pattern - see DP-AUTOSAR-009"
        - rule: "misra-c2012-20.9"
          reason: "accepted pattern - see DP-AUTOSAR-010"
        - rule: "misra-c2012-5.8"
          reason: "accepted pattern - see DP-AUTOSAR-012"
        - rule: "misra-c2012-2.7"
          reason: "accepted pattern - see DP-AUTOSAR-014"
        - rule: "misra-c2012-15.6"
          reason: "accepted pattern - see DP-AUTOSAR-015"
        - rule: "misra-c2012-11.5"
          reason: "accepted pattern - see DP-AUTOSAR-016"
        - rule: "misra-c2012-8.8"
          reason: "accepted pattern - see DP-AUTOSAR-017"
        - rule: "misra-c2012-5.7"
          reason: "accepted pattern - see DP-AUTOSAR-018"
        - rule: "misra-c2012-10.8"
          reason: "accepted pattern - see DP-AUTOSAR-019"
      deviation_expiry_days: 180
    testing:
      name: "testing"
      rule_overrides:
        - rule: "misra-c2023-21.3"
          enabled: false
      deviations: []
hardware_test:
  enabled: false
  mock: true
  firmware: "build-native/firmware.elf"
  boot_pattern: "Boot Complete"
  flash_tool: "auto"
  serial_port: ""
  baud: 115200
  test_timeout: 30
  boot_delay: 2.0
  test_scripts_dir: "tests/hil"
