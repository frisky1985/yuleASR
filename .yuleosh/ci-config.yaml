# yuleASR CI Configuration
# ─────────────────────────────────────
# AUTOSAR BSW 平台 CI 流水线配置

ci:
  layers: [1, 2, 3]
  layer_dependencies:
    1: []
    2: [1]
    3: [1, 2]

coverage:
  threshold_line: 85.0
  threshold_condition: 85.0
  c_fail_under: 85
  strict: false
  threshold_branch: 60.0
  module_thresholds:
    src/ecual: 75.0
    src/mcal: 75.0
    src/services: 80.0

misra:
  enabled: true
  addon: "misra"
  active_profile: "safety"
  fail_on_required: true
  fail_on_advisory: false
  fail_threshold: 100
  violations_per_kloc: 50.0
  cppcheck_std: "c11"
  exclude_paths:
    - "tests/**"
    - "third_party/**"
    - "build/**"
    - "Drivers/**"
    - "Middlewares/**"
    - "CMSIS/**"
  code_categories:
    template:
      paths: ["src/yuleosh/templates/**", "test-dogfood/**"]
      action: exclude
      block_on: false
    third_party:
      paths: ["third_party/**", "Drivers/**", "Middlewares/**", "CMSIS/**", "vendor/**", "lib/**"]
      action: alert
      block_on: false
    business:
      paths: ["src/**"]
      action: enforce
      block_on: false
  profiles:
    safety:
      name: "safety"
      rule_overrides: []
      deviations: []
    testing:
      name: "testing"
      rule_overrides:
        - rule: "misra-c2023-21.3"
          enabled: false
      deviations: []

code_style:
  file_size_limits:
    autosar_bsw:
      max_lines: 5000
      description: "AUTOSAR BSW模块 (MCAL/ECUAL/Services)"
    application:
      max_lines: 2000
      description: "Application/SWC 代码"
    default:
      max_lines: 1000
      description: "其他/一般代码"
  enabled: true
  exclude_paths:
    - "third_party/**"
    - "Drivers/**"
    - "vendor/**"
    - "*.generated.c"

hardware_test:
  enabled: false
  mock: true
  firmware: "build-native/firmware.elf"
  boot_pattern: "Boot Complete"
  flash_tool: "auto"
  serial_port: ""
  baud: 115200
  test_timeout: 30
  boot_delay: 2.0
  test_scripts_dir: "tests/hil"
