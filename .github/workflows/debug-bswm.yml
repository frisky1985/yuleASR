name: debug-bswm

on:
  push:
    branches: [debug/bswm-linux]

jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Environment
        run: |
          uname -a
          ulimit -s || true
          gcc --version | head -1

      - name: Build with sanitizers
        run: |
          cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-dbg --target bswm_unit_test -j4

      - name: Run sanitized
        run: |
          ./build-dbg/tests/bswm_unit_test; echo "exit=$?"

      - name: Plain build + run
        run: |
          cmake -S . -B build-plain -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-plain --target bswm_unit_test -j4
          ./build-plain/tests/bswm_unit_test; echo "plain_exit=$?"

      - name: Backtrace on crash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          gdb -batch -ex run -ex "thread apply all bt full" --args ./build-plain/tests/bswm_unit_test || true
