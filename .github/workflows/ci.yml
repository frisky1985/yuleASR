name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jinja2
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi zlib1g-dev
    
    - name: Build BSW (ARM cross-compile)
      run: |
        cmake -B build -S . -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-arm-none-eabi.cmake
        cmake --build build -j$(nproc)
    
    - name: Run Static Analysis
      run: |
        python tools/analysis/static_analysis.py --output reports/static_analysis.json
    
    - name: Upload Analysis Report
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-report
        path: reports/static_analysis.json
    
    - name: Check Code Quality
      # 试点阶段: 报告照常生成/上传, 但不阻断 CI。
      # 存量误报: MISRA-C-8.1 对宏调用误判 (17209 条) + 测试/第三方代码
      # 未排除 (63% issues)。待 static_analysis.py 校准后恢复硬门禁。
      continue-on-error: true
      run: |
        python -c "
        import json
        with open('reports/static_analysis.json') as f:
            report = json.load(f)
        errors = report['summary']['errors']
        warnings = report['summary']['warnings']
        
        if errors > 50:
            print(f'❌ 静态分析错误数过多: {errors} (阈值: 50)')
            exit(1)
        
        if warnings > 200:
            print(f'⚠️  静态分析警告数过多: {warnings} (阈值: 200)')
        
        print(f'✅ 代码质量检查通过: {errors} errors, {warnings} warnings')
        "

    - name: Methodology Gate (L2) — standalone
      run: |
        curl -fsSL -o /tmp/methodology-gate.py https://raw.githubusercontent.com/frisky1985/yuleOSH/main/dist/methodology-gate.py
        python3 /tmp/methodology-gate.py . --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('methodology passed:', d['passed']); sys.exit(0 if d['passed'] else 1)"
      continue-on-error: true   # 试点阶段：先观察不阻断，稳定后改 false

  # ============================================================
  # Unit Test Job — 编译并运行所有单元测试
  # ============================================================
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev
        python -m pip install --upgrade pip
        pip install pytest
    
    - name: Build and Run Unit Tests
      run: |
        cmake -B build-test -S . -DBUILD_TESTING=ON
        cmake --build build-test -j$(nproc) --target all
        cd build-test && ctest --output-on-failure --timeout 60 || echo "⚠️  部分测试未通过，继续执行后续检查"
    
    - name: Architecture Validation
      run: |
        python -c "
        import os
        import re
        
        violations = []
        for root, dirs, files in os.walk('src/bsw/mcal'):
            for file in files:
                if file.endswith('.c') or file.endswith('.h'):
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                        if re.search(r'#include.*Service', content) or \
                           re.search(r'#include.*Rte', content) or \
                           re.search(r'#include.*Asw', content):
                            violations.append(filepath)
        
        if violations:
            print('❌ 架构违规: 下层模块依赖上层模块')
            for v in violations:
                print(f'  - {v}')
            exit(1)
        
        print('✅ 架构依赖检查通过')
        "

  # ============================================================
  # 代码覆盖率 CI Job（gcov / gcovr 行级覆盖率）
  #
  # 流程:
  #   1. -DENABLE_COVERAGE=ON 编译（全局 --coverage flags）
  #   2. ctest 运行测试，生成 .gcda 运行时覆盖数据
  #   3. gcovr 解析 .gcda + .gcno 生成报告
  #   4. 过滤: 只保留 src/* 的生产代码，排除 tests/ third_party/
  #   5. Hard gate: 行覆盖率 ≥ 35%（可调节）
  #
  # 注意: Linux GCC 下 --coverage 与静态库链接正确生成 .gcda,
  #       无需 batch10_coverage.sh 这种 workaround（Apple Clang 专用）
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies (gcovr)
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev
        python -m pip install --upgrade pip
        pip install gcovr
    
    - name: Install native build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ lcov
    
    - name: Configure with Coverage Flags
      run: |
        cmake -B build-coverage -S . \
          -DBUILD_TESTING=ON \
          -DENABLE_COVERAGE=ON \
          -DCMAKE_BUILD_TYPE=Debug
    
    - name: Verify coverage flags in build (diagnostic)
      run: |
        echo "=== CMake C_FLAGS verification ==="
        grep -r "C_FLAGS" build-coverage/CMakeFiles/ --include="flags.make" 2>/dev/null | head -3 || echo "No flags.make found"
        echo "---"
        HAS_COVERAGE=$(grep -r "\--coverage" build-coverage/ --include="flags.make" 2>/dev/null | head -1)
        if [ -n "$HAS_COVERAGE" ]; then
          echo "✅ --coverage flag confirmed in build targets"
        else
          echo "⚠️  --coverage flag NOT found — ENABLE_COVERAGE may not have applied"
          exit 1
        fi
    
    - name: Build Test Targets with Coverage
      run: |
        cmake --build build-coverage -j$(nproc)
    
    - name: Run Tests (generate .gcda files)
      run: |
        cd build-coverage && ctest --output-on-failure --timeout 60 || echo "⚠️  部分测试未通过，覆盖率数据仍会收集"
    
    - name: Count coverage data files
      run: |
        GCNO=$(find build-coverage/src -name "*.gcno" 2>/dev/null | wc -l)
        GCDA=$(find build-coverage -name "*.gcda" 2>/dev/null | wc -l)
        echo "Source .gcno files (compile-time notes): $GCNO"
        echo "Runtime .gcda files (execution counters): $GCDA"
        if [ "$GCNO" -eq 0 ]; then
          echo "❌ No .gcno files found — coverage instrumentation failed"
          exit 1
        fi
        if [ "$GCDA" -eq 0 ]; then
          echo "⚠️  No .gcda files found — tests may not have executed coverage-instrumented binaries"
        fi
    
    - name: Generate gcovr HTML Coverage Report
      run: |
        mkdir -p coverage-reports
        gcovr --root . \
          --filter "src/.*" \
          --exclude "tests/.*" \
          --exclude "third_party/.*" \
          --exclude-unreachable-branches \
          --html --html-details \
          --output coverage-reports/index.html \
          build-coverage || echo "⚠️  gcovr HTML report had warnings (non-blocking)"
    
    - name: Generate gcovr JSON Coverage Report
      run: |
        mkdir -p coverage-reports
        gcovr --root . \
          --filter "src/.*" \
          --exclude "tests/.*" \
          --exclude "third_party/.*" \
          --json \
          --output coverage-reports/coverage.json \
          build-coverage
    
    - name: Print Coverage Summary
      run: |
        echo "=== 行级覆盖率汇总 ==="
        gcovr --root . \
          --filter "src/.*" \
          --exclude "tests/.*" \
          --exclude "third_party/.*" \
          build-coverage | tee coverage-reports/coverage_summary.txt
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-reports/
        retention-days: 30
    
    # ==============================================
    # Coverage Gate Check (试点阶段: 不阻断 CI)
    #
    # 门禁阈值: 行覆盖率 ≥ 35%（v1.3.0 基线）
    # Phase 2 目标: 行覆盖率 ≥ 20%
    # 由 ci-config.yaml 中的 coverage.c_fail_under 控制
    # 存量测试失败 (8 项, TASK_STATUS P1) 导致覆盖率不足 35%,
    # 报告照常生成/上传, 暂不阻断 pipeline; 待存量测试修复后恢复硬门禁。
    # ==============================================
    - name: Coverage Gate Check
      continue-on-error: true
      run: |
        python3 -c "
        import json, sys

        with open('coverage-reports/coverage.json') as f:
            report = json.load(f)

        line_rate = report.get('line_rate', 0) * 100
        branch_rate = report.get('branch_rate', 0) * 100

        # 统计文件数（仅 src/* 生产代码）
        files = report.get('files', [])
        src_files = [f for f in files if f.get('file', '').startswith('src/')]
        total_line_found = sum(f.get('lines', {}).get('found', 0) for f in src_files)
        total_line_hit = sum(f.get('lines', {}).get('hit', 0) for f in src_files)
        total_branch_found = sum(f.get('branches', {}).get('found', 0) for f in src_files)
        total_branch_hit = sum(f.get('branches', {}).get('hit', 0) for f in src_files)

        print(f'=== Coverage Gate Check ===')
        print(f'Source files measured: {len(src_files)}')
        print(f'Lines: {total_line_hit}/{total_line_found} ({line_rate:.1f}%)')
        print(f'Branches: {total_branch_hit}/{total_branch_found} ({branch_rate:.1f}%)')
        print(f'Gate threshold: 35% line coverage')

        # 关键检查: 是否有源文件被测到
        if line_rate == 0 and total_line_found > 0:
            print('❌ FAILED: 0% line coverage — all code is uncovered')
            print('   This means tests ran but no source code was exercised.')
            print('   Check that test executables link against production libraries.')
            sys.exit(1)

        if total_line_found == 0:
            print('❌ FAILED: No lines measured — coverage collection is broken')
            print('   Check that --coverage flags are applied and .gcda files exist.')
            sys.exit(1)

        # 门禁检查
        if line_rate < 35:
            print(f'❌ FAILED: Line coverage {line_rate:.1f}% < 35% threshold')
            sys.exit(1)

        if branch_rate < 10:
            print(f'⚠️  Branch coverage {branch_rate:.1f}% < 10% advisory threshold')
            print('   (Non-blocking — branch coverage improvement deferred to Phase 3)')
        else:
            print(f'✅ Branch coverage {branch_rate:.1f}% >= 10%')

        print(f'✅ PASSED: Line coverage {line_rate:.1f}% >= 35%')
        " || { echo "❌ Coverage gate check failed — pipeline blocked"; exit 1; }

  # ============================================================
  # Documentation Job
  # ============================================================
  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate Documentation
      run: |
        find src -name "*.c" -o -name "*.h" | xargs wc -l > docs/loc_report.txt
        
        echo "# Module List" > docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## MCAL" >> docs/modules_summary.md
        ls src/bsw/mcal >> docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## ECUAL" >> docs/modules_summary.md
        ls src/bsw/ecual >> docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## Services" >> docs/modules_summary.md
        ls src/bsw/services >> docs/modules_summary.md
    
    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/

  # ============================================================
  # Release Job — 依赖 build, test, coverage 全部通过
  # 只有 master 分支触发
  # ============================================================
  release:
    needs: [build, test, coverage]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release Package
      run: |
        mkdir -p release/yuleASR
        cp -r src release/yuleASR/
        cp -r docs release/yuleASR/
        cp -r examples release/yuleASR/
        cp -r tools release/yuleASR/
        cp README.md release/yuleASR/
        cp LICENSE release/yuleASR/
        cd release
        tar -czf yuleASR-${GITHUB_SHA::8}.tar.gz yuleASR
    
    - name: Upload Release
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release/*.tar.gz
