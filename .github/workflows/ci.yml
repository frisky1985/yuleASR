name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jinja2
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Build BSW
      run: |
        mkdir -p build
        cd build
        cmake ../tools/build -DCMAKE_TOOLCHAIN_FILE=../cmake/arm-gcc-toolchain.cmake
        make -j$(nproc)
    
    - name: Run Static Analysis
      run: |
        python tools/analysis/static_analysis.py --output reports/static_analysis.json
    
    - name: Upload Analysis Report
      uses: actions/upload-artifact@v3
      with:
        name: static-analysis-report
        path: reports/static_analysis.json
    
    - name: Check Code Quality
      run: |
        python -c "
        import json
        with open('reports/static_analysis.json') as f:
            report = json.load(f)
        errors = report['summary']['errors']
        warnings = report['summary']['warnings']
        
        # 严格质量门禁: 错误数 < 50, 警告数 < 200
        if errors > 50:
            print(f'❌ 静态分析错误数过多: {errors} (阈值: 50)')
            exit(1)
        
        if warnings > 200:
            print(f'⚠️  静态分析警告数过多: {warnings} (阈值: 200)')
            # 警告仅提示，不阻止构建
        
        print(f'✅ 代码质量检查通过: {errors} errors, {warnings} warnings')
        "

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    
    - name: Run Unit Tests
      run: |
        cd tests/unit
        # 编译测试框架和测试用例
        gcc -o test_runner \
          test_framework.h \
          test_mcu.c \
          -I../../src/bsw/mcal/mcu/include \
          -I../../src/bsw/common \
          -lm
        
        # 执行测试并生成报告
        ./test_runner --xml > test_results.xml
        echo "✅ 单元测试执行完成"
      
      # TODO: 待更多测试文件添加后启用覆盖率检查
      # - name: Coverage Check
      #   run: |
      #     pip install gcovr
      #     gcovr --root src/bsw \
      #           --exclude '.*test.*' \
      #           --json coverage.json \
      #           --txt coverage.txt
      #     python -c "
      #     import json
      #     with open('coverage.json') as f:
      #         cov = json.load(f)
      #     coverage = cov['summary']['line_covered']
      #     if coverage < 80:
      #         print(f'❌ 测试覆盖率不足: {coverage}% (目标: 80%)')
      #         exit(1)
      #     print(f'✅ 测试覆盖率达标: {coverage}%')
      #     "
    
    - name: Architecture Validation
      run: |
        # 验证分层架构依赖关系
        python -c "
        import os
        import re
        
        # 检查是否有下层依赖上层的违规
        violations = []
        
        # MCAL 不应依赖 Service/RTE/ASW
        for root, dirs, files in os.walk('src/bsw/mcal'):
            for file in files:
                if file.endswith('.c') or file.endswith('.h'):
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                        if re.search(r'#include.*Service', content) or \
                           re.search(r'#include.*Rte', content) or \
                           re.search(r'#include.*Asw', content):
                            violations.append(filepath)
        
        if violations:
            print('❌ 架构违规: 下层模块依赖上层模块')
            for v in violations:
                print(f'  - {v}')
            exit(1)
        
        print('✅ 架构依赖检查通过')
        "

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Generate Documentation
      run: |
        # Count lines of code
        find src -name "*.c" -o -name "*.h" | xargs wc -l > docs/loc_report.txt
        
        # Generate module list
        echo "# Module List" > docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## MCAL" >> docs/modules_summary.md
        ls src/bsw/mcal >> docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## ECUAL" >> docs/modules_summary.md
        ls src/bsw/ecual >> docs/modules_summary.md
        echo "" >> docs/modules_summary.md
        echo "## Services" >> docs/modules_summary.md
        ls src/bsw/services >> docs/modules_summary.md
    
    - name: Upload Documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Release Package
      run: |
        mkdir -p release/yuleASR
        cp -r src release/yuleASR/
        cp -r docs release/yuleASR/
        cp -r examples release/yuleASR/
        cp -r tools release/yuleASR/
        cp README.md release/yuleASR/
        cp LICENSE release/yuleASR/
        cd release
        tar -czf yuleASR-${GITHUB_SHA::8}.tar.gz yuleASR
    
    - name: Upload Release
      uses: actions/upload-artifact@v3
      with:
        name: release-package
        path: release/*.tar.gz
