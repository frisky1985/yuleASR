name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Config Drift Gate — 双重漂移检测
  #   1) ci.yml 内嵌阈值与 ci-config.yaml 一致性 (P0-5 硬化, 2026-10-07)
  #   2) config/generated/* 与 bsw_config.json 重新生成一致性 (P0-4, spec 6.4)
  # ============================================================
  config-drift:
    name: Config Drift Gate (thresholds + bsw_config regeneration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check gate threshold drift
        # 背景: P0-5 提升分支覆盖率阈值 (20%→25%) 时发现，ci.yml 内嵌解析
        # 正则会先命中 ci-config.yaml 注释中的历史值 (20.0)，真实键值 25.0
        # 被遮蔽 —— 门禁实际仍按旧阈值判定（已修复为行首锚定正则）。
        # 本步骤用 YAML 解析 (非正则) 校验三处一致：
        #   1) ci-config.yaml YAML 解析值 (权威);
        #   2) 门禁运行时正则提取值;
        #   3) ci.yml 兜底默认值。
        # 任一漂移立即阻断 CI，防止门禁阈值再次静默失效。
        run: |
          python3 -c '
          import re, sys, yaml

          cfg = yaml.safe_load(open(".yuleosh/ci-config.yaml"))
          cfg_fu = int(cfg["coverage"]["c_fail_under"])
          cfg_bt = float(cfg["coverage"]["threshold_branch"])

          # 1) 门禁运行时提取路径 (与 ci.yml Coverage Gate Check 相同的行首锚定正则)
          txt = open(".yuleosh/ci-config.yaml").read()
          m = re.search(r"^[ \t]*c_fail_under:\s*(\d+)", txt, re.MULTILINE)
          rx_fu = int(m.group(1)) if m else None
          m = re.search(r"^[ \t]*threshold_branch:\s*([\d.]+)", txt, re.MULTILINE)
          rx_bt = float(m.group(1)) if m else None

          # 2) ci.yml 兜底默认值
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          steps = wf["jobs"]["coverage"]["steps"]
          gate = [s for s in steps if s.get("name") == "Coverage Gate Check"][0]
          m = re.search(r"fail_under = (\d+)", gate["run"])
          fb_fu = int(m.group(1)) if m else None
          m = re.search(r"branch_thr = ([\d.]+)", gate["run"])
          fb_bt = float(m.group(1)) if m else None

          print(f"ci-config.yaml (YAML-parsed): c_fail_under={cfg_fu}, threshold_branch={cfg_bt}")
          print(f"gate regex extraction       : c_fail_under={rx_fu}, threshold_branch={rx_bt}")
          print(f"ci.yml fallback defaults    : fail_under={fb_fu}, branch_thr={fb_bt}")

          if not (rx_fu == cfg_fu and rx_bt == cfg_bt and fb_fu == cfg_fu and fb_bt == cfg_bt):
              print("FAILED: coverage gate thresholds drifted between ci.yml and ci-config.yaml")
              sys.exit(1)
          print("PASSED: gate thresholds consistent (regex extraction == YAML values == fallbacks)")
          '

      - name: Check BSW config regeneration drift
        # 量产门禁：P0-4 配置生成闭环 (spec 6.4)。重新生成 → diff committed →
        # 不一致则失败: 防止手改 config/generated/* 或改 bsw_config.json 后
        # 忘记重新生成（提交的生成物与配置源漂移）。
        # 基线已验证 (2026-10-07): 当前树 exit 0 — 7 个 *_Cfg.h 模板渲染 +
        # RTE 输出 (Rte.h/Rte.c/Rte_Type.h/Rte_*SWC.*) 与提交版本一致。
        run: |
          if ! python3 -c "import jinja2, jsonschema" 2>/dev/null; then
            python3 -m pip install --quiet jinja2 jsonschema \
              || python3 -m pip install --break-system-packages --quiet jinja2 jsonschema
          fi
          bash config/tools/check_config_drift.sh

  # ============================================================
  # Build — ARM 交叉编译 + 静态分析 + 架构检查
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          pip-packages: jinja2
          apt-packages: gcc-arm-none-eabi

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          build-testing: 'OFF'
          toolchain-file: cmake/toolchain-arm-none-eabi.cmake

      - name: Verify ARM artifacts
        run: |
          echo "--- libOs.a FreeRTOS kernel symbols ---"
          arm-none-eabi-nm build/lib/bsw/os/libOs.a | grep -E " T (xTaskCreate|xEventGroupCreate|vTaskStartScheduler)" || true
          echo "--- libRte.a Rte symbols ---"
          arm-none-eabi-nm build/lib/bsw/rte/libRte.a | grep -c " T Rte_" || true

      - name: Run Static Analysis
        run: |
          python tools/analysis/static_analysis.py --output reports/static_analysis.json

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-report
          path: reports/static_analysis.json

      - name: Check Code Quality
        # 量产门禁：P0-5 硬化 (2026-10-07)。静态分析失败必须阻断 CI。
        # 误报根因已修复 (static_analysis.py):
        #   1. 排除 tests/ 与 third_party/ 扫描结果 (63% 误报来源);
        #   2. 修复 MISRA-C-8.1 模式缺陷 — 原模式误报所有 if/for/while/switch
        #      同行大括号语句与正常函数定义 (src/ 中 15743 条);
        #   3. 非 ASCII 行注释重分类为 CHARSET-001 warning (中文注释为项目规范)。
        # 修复后基线: 0 errors / ~1305 warnings (仅 advisory)。
        continue-on-error: false
        run: |
          python -c "
          import json
          with open('reports/static_analysis.json') as f:
              report = json.load(f)
          errors = report['summary']['errors']
          warnings = report['summary']['warnings']

          if errors > 50:
              print(f'❌ 静态分析错误数过多: {errors} (阈值: 50)')
              exit(1)

          if warnings > 200:
              print(f'⚠️  静态分析警告数过多: {warnings} (阈值: 200)')

          print(f'✅ 代码质量检查通过: {errors} errors, {warnings} warnings')
          "

      - name: Methodology Gate (L2) — standalone
        # 量产门禁：P0-5 硬化 (2026-10-07)。方法论门禁已从试点观察阶段转为硬门禁。
        run: |
          curl -fsSL -o /tmp/methodology-gate.py https://raw.githubusercontent.com/frisky1985/yuleOSH/main/dist/methodology-gate.py
          python3 /tmp/methodology-gate.py . --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('methodology passed:', d['passed']); sys.exit(0 if d['passed'] else 1)"
        continue-on-error: false  # 量产门禁：P0-5 硬化 (2026-10-07)，方法论失败必须阻断 CI

  # ============================================================
  # Unit Test — native 编译 + 全量单测 + 架构依赖检查
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          pip-packages: pytest
          apt-packages: build-essential cmake ninja-build libssl-dev libsqlite3-dev

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          build-type: Debug
          build-testing: 'ON'
          generator: Ninja

      - name: Run Unit Tests
        # 量产门禁：P0-5 硬化 (2026-10-07)。测试失败必须阻断 CI。
        working-directory: build-test
        run: ctest --output-on-failure --timeout 60 -j$(nproc)

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: build-test/Testing/
          retention-days: 14

      - name: Architecture Validation
        run: |
          python -c "
          import os
          import re

          violations = []
          for root, dirs, files in os.walk('src/bsw/mcal'):
              for file in files:
                  if file.endswith('.c') or file.endswith('.h'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                          if re.search(r'#include.*Service', content) or \
                             re.search(r'#include.*Rte', content) or \
                             re.search(r'#include.*Asw', content):
                              violations.append(filepath)

          if violations:
              print('❌ 架构违规: 下层模块依赖上层模块')
              for v in violations:
                  print(f'  - {v}')
              exit(1)

          print('✅ 架构依赖检查通过')
          "

  # ============================================================
  # Smoke — Linux native 运行验证 (s0_smoke_test)
  # ============================================================
  native-smoke:
    name: Native smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          apt-packages: build-essential cmake ninja-build

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          build-testing: 'ON'
          targets: s0_smoke_test

      - name: "Run smoke test (expect RESULT: ALL CHECKS PASSED)"
        run: |
          set -o pipefail
          OUTPUT=$(./build/bin/s0_smoke_test 2>&1)
          echo "$OUTPUT"
          echo "--- assertions ---"
          grep -q "RESULT: ALL CHECKS PASSED" <<< "$OUTPUT" && echo "PASS: RESULT marker found"
          grep -qE "Rte_SchedulerGetTickCount = [1-9][0-9]*" <<< "$OUTPUT" && echo "PASS: tick counter advanced"
          echo "SMOKE_OK=1" >> "$GITHUB_ENV"

      - name: Assert exit path
        run: |
          if [ "${SMOKE_OK:-0}" != "1" ]; then
            echo "::error::s0_smoke_test did not pass all assertions"
            exit 1
          fi

  # ============================================================
  # Coverage — gcovr 行级覆盖率 + 硬门禁
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          pip-packages: gcovr
          apt-packages: build-essential cmake ninja-build gcc g++ lcov zlib1g-dev

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: build-coverage
          build-testing: 'ON'
          enable-coverage: 'ON'
          generator: Ninja

      - name: Verify coverage flags in build (diagnostic)
        run: |
          echo "=== coverage flag verification ==="
          # Ninja writes the flags into build.ninja; only the Makefile generator
          # emits per-target flags.make. Probe whichever this build produced —
          # grepping flags.make unconditionally always failed under Ninja.
          if grep -rsq -- "--coverage" build-coverage/build.ninja 2>/dev/null; then
            echo "✅ --coverage flag confirmed in build.ninja"
          elif grep -rsq -- "--coverage" build-coverage/ --include="flags.make" 2>/dev/null; then
            echo "✅ --coverage flag confirmed in flags.make"
          else
            echo "⚠️  --coverage flag NOT found — ENABLE_COVERAGE may not have applied"
            exit 1
          fi

      - name: Run Tests (generate .gcda files)
        # 量产门禁：P0-5 硬化 (2026-10-07)。测试失败必须阻断 CI。
        run: |
          cd build-coverage && ctest --output-on-failure --timeout 60 -j$(nproc)

      - name: Count coverage data files
        run: |
          GCNO=$(find build-coverage/src -name "*.gcno" 2>/dev/null | wc -l)
          GCDA=$(find build-coverage -name "*.gcda" 2>/dev/null | wc -l)
          echo "Source .gcno files (compile-time notes): $GCNO"
          echo "Runtime .gcda files (execution counters): $GCDA"
          if [ "$GCNO" -eq 0 ]; then
            echo "❌ No .gcno files found — coverage instrumentation failed"
            exit 1
          fi
          if [ "$GCDA" -eq 0 ]; then
            echo "⚠️  No .gcda files found — tests may not have executed coverage-instrumented binaries"
          fi

      - name: Generate gcovr HTML Coverage Report
        # 量产门禁：P0-5 硬化 (2026-10-07)。gcovr 失败必须阻断 CI。
        run: |
          mkdir -p coverage-reports
          gcovr --root . \
            --filter "src/.*" \
            --exclude "tests/.*" \
            --exclude "third_party/.*" \
            --branches \
            --exclude-unreachable-branches \
            --html --html-details \
            --output coverage-reports/index.html \
            build-coverage

      - name: Generate gcovr JSON Coverage Report
        # 量产门禁：P0-5 硬化 (2026-10-07)。加 --branches 输出分支数据，
        # 供 Coverage Gate Check 分支门禁消费 (此前无分支数据时门禁被跳过)。
        run: |
          mkdir -p coverage-reports
          gcovr --root . \
            --filter "src/.*" \
            --exclude "tests/.*" \
            --exclude "third_party/.*" \
            --branches \
            --json \
            --output coverage-reports/coverage.json \
            build-coverage

      - name: Print Coverage Summary
        run: |
          echo "=== 行级/分支覆盖率汇总 ==="
          # 量产门禁：P0-5 硬化 (2026-10-07)。加 --branches 输出分支覆盖率。
          gcovr --root . \
            --filter "src/.*" \
            --exclude "tests/.*" \
            --exclude "third_party/.*" \
            --branches \
            build-coverage | tee coverage-reports/coverage_summary.txt

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-reports/
          retention-days: 30

      # ==============================================
      # Coverage Gate Check (硬门禁 — 2026-08-07 批D恢复)
      #
      # 量产门禁：P0-5 硬化 (2026-10-07)。gcovr 已加 --branches，分支门禁
      # 正式生效；阈值随 ci-config.yaml 提升 (branch 20% → 25%)。
      #
      # 阈值来源: .yuleosh/ci-config.yaml coverage.c_fail_under
      #   (2026-08-07 校准: 40%, 依据 ASIL 模块重建后当日实测 line 43.25%)
      # ==============================================
      - name: Coverage Gate Check
        run: |
          python3 -c "
          import json, sys, re

          # 从 ci-config.yaml 读取阈值 (c_fail_under / threshold_branch)
          # 量产门禁：P0-5 (2026-10-07)。分支阈值基线 20% → 25%，
          # 此处默认值与 ci-config.yaml 保持同步（yaml 为权威来源）。
          fail_under = 40
          branch_thr = 25
          try:
              with open('.yuleosh/ci-config.yaml') as f:
                  txt = f.read()
              # P0-5 (2026-10-07): 锚定行首的真实 YAML 键再取值。此前无行首锚定，
              # re.search 会先命中注释中的历史阈值文本（如 # threshold_branch: 20.0%），
              # 注释旧值会覆盖实际键值（阈值提升到 25% 时被误读回 20%）。
              m = re.search(r'^[ \t]*c_fail_under:\s*(\d+)', txt, re.MULTILINE)
              if m: fail_under = int(m.group(1))
              m = re.search(r'^[ \t]*threshold_branch:\s*([\d.]+)', txt, re.MULTILINE)
              if m: branch_thr = float(m.group(1))
          except Exception as e:
              print(f'⚠️  ci-config.yaml 读取失败, 使用默认阈值: {e}')

          with open('coverage-reports/coverage.json') as f:
              report = json.load(f)

          # gcovr 两种 JSON 结构都要能解析:
          #   --json-summary : {'lines': {'found': N, 'hit': M}, 'branches': {...}}
          #   --json         : {'lines': [ {...count...} ], 'branches': [ ... ]}
          # 本 workflow 生成的是后者, 原先只按前者取值，在 lines 是列表时
          # 触发 AttributeError: 'list' object has no attribute 'get'，
          # 使门禁在覆盖率正常的情况下也必然失败。
          def _count(entry):
              if isinstance(entry, dict):
                  return entry.get('found', 0), entry.get('hit', 0)
              if isinstance(entry, list):
                  found = len(entry)
                  hit = sum(1 for item in entry
                            if isinstance(item, dict) and item.get('count', 0) > 0)
                  return found, hit
              return 0, 0

          # 统计文件数（仅 src/* 生产代码）
          files = report.get('files', []) or []
          src_files = [f for f in files
                       if isinstance(f, dict) and f.get('file', '').startswith('src/')]

          total_line_found = 0
          total_line_hit = 0
          total_branch_found = 0
          total_branch_hit = 0
          for _f in src_files:
              _lf, _lh = _count(_f.get('lines'))
              _bf, _bh = _count(_f.get('branches'))
              total_line_found += _lf
              total_line_hit += _lh
              total_branch_found += _bf
              total_branch_hit += _bh

          # 根级 rate 可能缺失（--json 不带汇总），按总量回算
          _lr = report.get('line_rate')
          line_rate = (_lr * 100) if isinstance(_lr, (int, float)) else \
              (100.0 * total_line_hit / total_line_found if total_line_found else 0.0)
          _br = report.get('branch_rate')
          branch_rate = (_br * 100) if isinstance(_br, (int, float)) else \
              (100.0 * total_branch_hit / total_branch_found if total_branch_found else 0.0)

          print(f'=== Coverage Gate Check (hard gate) ===')
          print(f'Source files measured: {len(src_files)}')
          print(f'Lines: {total_line_hit}/{total_line_found} ({line_rate:.1f}%)')
          print(f'Branches: {total_branch_hit}/{total_branch_found} ({branch_rate:.1f}%)')
          print(f'Gate threshold (ci-config c_fail_under): {fail_under}% line')

          # 关键检查: 是否有源文件被测到
          if line_rate == 0 and total_line_found > 0:
              print('❌ FAILED: 0% line coverage — all code is uncovered')
              print('   This means tests ran but no source code was exercised.')
              print('   Check that test executables link against production libraries.')
              sys.exit(1)

          if total_line_found == 0:
              print('❌ FAILED: No lines measured — coverage collection is broken')
              print('   Check that --coverage flags are applied and .gcda files exist.')
              sys.exit(1)

          # 硬门禁检查 (strict: true)
          if line_rate < fail_under:
              print(f'❌ FAILED: Line coverage {line_rate:.1f}% < {fail_under}% hard-gate threshold')
              sys.exit(1)

          # 分支门禁: 只有本轮确实采集到分支数据时才判定。
          # P0-5 (2026-10-07): gcovr 已加 --branches，正常应输出分支信息；
          # total_branch_found 为 0 属于异常（如编译器未插桩分支），保留跳过
          # 作为兜底，避免拿 0.0% 去比 threshold_branch 得到虚假失败
          # （CI 日志中即表现为 Branches: 0/0 (0.0%)）。
          # 注意: 本段 Python 位于双引号包裹的 shell 字符串内，正文不可出现
          # 未转义的双引号，否则会提前终止该字符串。
          if total_branch_found == 0:
              print(f'⚠️  SKIP: 未采集到分支数据 (gcovr 已加 --branches 仍为空，'
                    f'需检查编译器分支插桩)，跳过分支门禁 (配置阈值 {branch_thr}%)')
              print(f'✅ PASSED: Line {line_rate:.1f}% >= {fail_under}% （分支门禁已跳过）')
          else:
              if branch_rate < branch_thr:
                  print(f'❌ FAILED: Branch coverage {branch_rate:.1f}% < {branch_thr}% threshold')
                  sys.exit(1)
              print(f'✅ PASSED: Line {line_rate:.1f}% >= {fail_under}%, Branch {branch_rate:.1f}% >= {branch_thr}%')
          " || { echo "❌ Coverage gate check failed — pipeline blocked"; exit 1; }

  # ============================================================
  # Integration Tests — 编译 + 上传产物 (被 e2e/uds/ota 等依赖)
  # ============================================================
  integration-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          pip-packages: gcovr
          apt-packages: build-essential cmake ninja-build libssl-dev libsqlite3-dev valgrind

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          build-type: Release
          build-testing: 'ON'
          enable-coverage: 'ON'
          generator: Ninja

      - name: Run Unit Tests
        working-directory: build
        run: ctest -C Release --output-on-failure -j$(nproc)

      - name: Generate Coverage Report
        run: |
          cmake --build build --target coverage

      - name: Upload Coverage
        # 量产门禁：P0-5 硬化 (2026-10-07)。codecov 上传失败必须阻断 CI。
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.info
          fail_ci_if_error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            build/bin/
            build/lib/
            build/test-results/

  # E2E DDS Communication Tests
  e2e-dds-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            net-tools \
            tcpdump

      - name: Run E2E DDS Tests
        run: |
          chmod +x build/bin/test_e2e_dds
          ./build/bin/test_e2e_dds 2>&1 | tee test-results-e2e-dds.log

      - name: Run SecOC E2E Tests
        run: |
          chmod +x build/bin/test_e2e_secoc
          ./build/bin/test_e2e_secoc 2>&1 | tee test-results-e2e-secoc.log

      - name: Run E2E Protection Tests
        run: |
          chmod +x build/bin/test_e2e_e2e
          ./build/bin/test_e2e_e2e 2>&1 | tee test-results-e2e-protection.log

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-dds-test-results
          path: |
            test-results-*.log
            *.pcap

  # UDS Diagnostics Tests
  uds-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Run UDS E2E Tests
        run: |
          chmod +x build/bin/test_e2e_uds
          ./build/bin/test_e2e_uds 2>&1 | tee test-results-uds.log

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uds-test-results
          path: test-results-uds.log

  # OTA Update Tests
  ota-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Run OTA E2E Tests
        run: |
          chmod +x build/bin/test_e2e_ota
          ./build/bin/test_e2e_ota 2>&1 | tee test-results-ota.log

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ota-test-results
          path: test-results-ota.log

  # Multi-ECU Integration Tests (Docker)
  multi-ecu-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      # tests/multi_ecu/ 整个目录不存在于仓库中 —— 此前因 integration-build
      # 一直失败而 skipped，掩盖了这一点。
      - name: Check prerequisites
        id: prereq
        uses: ./.github/actions/guard-artifacts
        with:
          capability: Multi-ECU 集成测试套件尚未实现（tests/multi_ecu/ 目录不在仓库中）
          required: |
            tests/multi_ecu/docker

      - name: Set up Docker Buildx
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Install Mininet
        if: steps.prereq.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mininet
          sudo modprobe openvswitch

      - name: Run Multi-ECU Discovery Tests
        if: steps.prereq.outputs.skip != 'true'
        run: |
          pip3 install pytest pytest-html
          python3 tests/multi_ecu/test_multi_ecu_discovery.py 2>&1 | tee test-results-multi-ecu.log

      - name: Run TSN Sync Tests
        if: steps.prereq.outputs.skip != 'true'
        run: |
          python3 tests/multi_ecu/test_tsn_sync.py 2>&1 | tee test-results-tsn-sync.log

      - name: Build Docker Images
        if: steps.prereq.outputs.skip != 'true'
        run: |
          cd tests/multi_ecu/docker
          docker-compose build --parallel

      - name: Run Docker Compose Tests
        if: steps.prereq.outputs.skip != 'true'
        run: |
          cd tests/multi_ecu/docker
          docker-compose up --abort-on-container-exit --timeout 120 2>&1 | tee ../../test-results-docker-compose.log
          docker-compose down

      - name: Network Fault Injection Tests
        if: steps.prereq.outputs.skip != 'true'
        run: |
          sudo python3 tests/multi_ecu/docker/network_simulator.py \
            --scenario automotive_worst_case \
            --interface lo \
            --ping-test 127.0.0.1 2>&1 | tee test-results-fault-injection.log

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always() && steps.prereq.outputs.skip != 'true'
        with:
          name: multi-ecu-test-results
          path: |
            test-results-multi-ecu.log
            test-results-tsn-sync.log
            test-results-docker-compose.log
            test-results-fault-injection.log

  # Performance Tests
  performance-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Run Latency Tests
        run: |
          chmod +x build/bin/test_latency
          ./build/bin/test_latency --duration 60 2>&1 | tee test-results-latency.log

      - name: Run Throughput Tests
        run: |
          chmod +x build/bin/test_throughput
          ./build/bin/test_throughput --duration 60 2>&1 | tee test-results-throughput.log

      - name: Run Memory Profiling
        run: |
          chmod +x build/bin/test_memory
          valgrind --tool=memcheck --leak-check=full \
            --xml=yes --xml-file=valgrind-report.xml \
            ./build/bin/test_memory 2>&1 | tee test-results-memory.log

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-test-results
          path: |
            test-results-latency.log
            test-results-throughput.log
            test-results-memory.log
            valgrind-report.xml

  # Security Tests
  security-tests:
    runs-on: ubuntu-22.04
    needs: integration-build
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Run Security Tests
        run: |
          chmod +x build/bin/test_security
          ./build/bin/test_security 2>&1 | tee test-results-security.log

      # cppcheck 静态分析不依赖上述二进制，保留执行。
      # 量产门禁：P0-5 硬化 (2026-10-07)。移除 `|| true` 兜底，cppcheck
      # 运行失败（内部错误/参数错误）必须阻断 CI。
      - name: Run Static Analysis (cppcheck)
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=all --xml --xml-version=2 \
            --suppress=missingIncludeSystem \
            -i build \
            src/ 2> cppcheck-report.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-test-results
          path: |
            test-results-security.log
            cppcheck-report.xml

  # Test Report Generation
  generate-report:
    runs-on: ubuntu-22.04
    needs:
      - e2e-dds-tests
      - uds-tests
      - ota-tests
      - multi-ecu-tests
      - performance-tests
      - security-tests
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download All Test Results
        uses: actions/download-artifact@v8
        with:
          path: all-test-results
          pattern: '*-test-results'

      - name: Generate Test Report
        # 量产门禁：P0-5 硬化 (2026-10-07)。脚本存在但执行失败时必须阻断 CI。
        # 注: scripts/generate_test_report.py 尚未实现（仓库中不存在），直接移除
        # `|| echo` 会让本 job 永久失败，违背"先修根因再关门禁"策略；改为显式
        # 存在性检查 + ::warning 告警，补齐脚本后切换为硬失败。
        run: |
          if [ -f scripts/generate_test_report.py ]; then
            python3 scripts/generate_test_report.py \
              --input all-test-results \
              --output test-report.html \
              --format html
          else
            echo "::warning::scripts/generate_test_report.py 未实现，跳过报告生成（产物仍会汇总上传）。P0-5 遗留项，补齐脚本后切换为硬门禁。"
          fi

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: |
            test-report.html
            all-test-results/

  # Docker Image Build and Push
  docker-build:
    runs-on: ubuntu-22.04
    needs: [integration-build, multi-ecu-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      # 与 multi-ecu-tests 同一缺口: tests/multi_ecu/ 不在仓库中，
      # 两个 Dockerfile.ecu / Dockerfile.ota 均不存在，此前一直被
      # integration-build 的失败掩盖为 skipped。
      - name: Check prerequisites
        id: prereq
        uses: ./.github/actions/guard-artifacts
        with:
          capability: Multi-ECU 容器化未实现（tests/multi_ecu/docker/Dockerfile.ecu / .ota 不在仓库中）
          required: |
            tests/multi_ecu/docker/Dockerfile.ecu
            tests/multi_ecu/docker/Dockerfile.ota

      - name: Set up Docker Buildx
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ECU Image
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/multi_ecu/docker/Dockerfile.ecu
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ecu-simulator:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ecu-simulator:${{ github.sha }}

      - name: Build and Push OTA Server Image
        if: steps.prereq.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/multi_ecu/docker/Dockerfile.ota
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ota-server:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/ota-server:${{ github.sha }}

  # ============================================================
  # Release — 依赖核心检查通过后打发布包 (仅 master)
  # ============================================================
  release:
    needs: [build, test, coverage, config-drift]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v7

      - name: Create Release Package
        run: |
          mkdir -p release/yuleASR
          cp -r src release/yuleASR/
          cp -r docs release/yuleASR/
          cp -r examples release/yuleASR/
          cp -r tools release/yuleASR/
          cp README.md release/yuleASR/
          cp LICENSE release/yuleASR/
          cd release
          tar -czf yuleASR-${GITHUB_SHA::8}.tar.gz yuleASR

      - name: Upload Release
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: release/*.tar.gz

  # ============================================================
  # Doxygen — Generate API documentation from header files
  # ============================================================
  doxygen:
    name: doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate API Documentation
        run: doxygen Doxyfile

      - name: Upload API Documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          path: docs/api/html/
          retention-days: 30
