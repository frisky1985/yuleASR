name: MISRA C:2023 Compliance Check

on:
  push:
    branches: [ master, develop, 'feature/*' ]
    paths:
      - '**.c'
      - '**.h'
      - 'tools/misra/**'
      - '.github/workflows/misra-check.yml'
      - '.misra_config'
      - '.yuleosh/ci-config.yaml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '**.c'
      - '**.h'
      - 'tools/misra/**'

env:
  BUILD_TYPE: Release
  MISRA_REPORT_DIR: reports/misra
  MISRA_STANDARD: c11
  MISRA_ADDON: misra  # yuleOSH MISRA addon v2 (C:2023 capable)

jobs:
  # ============================================================================
  # Detect changed C files
  # ============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      c_files: ${{ steps.changes.outputs.c_files }}
      new_code_only: ${{ steps.changes.outputs.new_code_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed C files
        id: changes
        run: |
          # Get list of changed C/H files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(c|h)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(c|h)$' || true)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check if any are in new code directories
          NEW_CODE_DIRS="src/diagnostics src/crypto_stack src/ota src/bootloader src/autosar/e2e"
          NEW_CODE_ONLY="true"
          
          for file in $CHANGED_FILES; do
            if [[ -f "$file" ]]; then
              for dir in $NEW_CODE_DIRS; do
                if [[ "$file" == *"$dir"* ]]; then
                  echo "Found new code file: $file"
                else
                  NEW_CODE_ONLY="false"
                fi
              done
            fi
          done
          
          # Output for next jobs
          echo "c_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "new_code_only=$NEW_CODE_ONLY" >> $GITHUB_OUTPUT
          
          # Save to file for artifact
          echo "$CHANGED_FILES" > changed_files.txt

      - name: Upload changed files list
        uses: actions/upload-artifact@v4
        with:
          name: changed-files
          path: changed_files.txt

  # ============================================================================
  # Cppcheck Analysis (MISRA C:2023)
  # ============================================================================
  cppcheck:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.c_files != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck python3 python3-pip

      - name: Download changed files list
        uses: actions/download-artifact@v4
        with:
          name: changed-files

      - name: Prepare file list
        run: |
          # Filter to existing C files
          cat changed_files.txt | grep '\.c$' | while read f; do
            if [ -f "$f" ]; then echo "$f"; fi
          done > files_to_check.txt
          
          echo "Files to check:"
          cat files_to_check.txt

      - name: Run Cppcheck MISRA C:2023 Analysis
        run: |
          mkdir -p ${{ env.MISRA_REPORT_DIR }}
          
          if [ ! -s files_to_check.txt ]; then
            echo "No C files to check"
            exit 0
          fi
          
          # Run cppcheck with MISRA addon — C:2023 ruleset
          # yuleOSH MISRA addon v2 auto-detects C:2023 rules; --rule-texts points to C:2023 texts
          cppcheck \
            --enable=all \
            --force \
            --inline-suppr \
            --std=${{ env.MISRA_STANDARD }} \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppressions-list=tools/misra/cppcheck_suppressions.xml \
            --addon=${{ env.MISRA_ADDON }} \
            --addon=${{ github.workspace }}/.yuleosh/misra-addon-config.json \
            --xml \
            --xml-version=2 \
            --file-list=files_to_check.txt \
            2> ${{ env.MISRA_REPORT_DIR }}/cppcheck-misra-c2023-report.xml || true

      - name: Parse Cppcheck MISRA C:2023 Results
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          import os

          report_file = "${{ env.MISRA_REPORT_DIR }}/cppcheck-misra-c2023-report.xml"
          
          if not os.path.exists(report_file):
              print("No cppcheck MISRA report found")
              sys.exit(0)
          
          try:
              tree = ET.parse(report_file)
              root = tree.getroot()
          except:
              print("Could not parse cppcheck report")
              sys.exit(0)
          
          errors = root.findall('.//error')
          
          # MISRA C:2023 rule severity classification
          # Required rules (must pass with deviation permits)
          C2023_REQUIRED_RULES = [
              '1.1', '1.2', '1.3', '1.4', '2.1', '2.2', '2.6', '2.7',
              '3.1', '3.2',
              '4.1', '4.2',
              '5.1', '5.2', '5.3', '5.4', '5.5', '5.6', '5.7', '5.8', '5.9', '5.10',
              '6.1', '6.2',
              '7.1', '7.2', '7.3', '7.4',
              '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.8', '8.9', '8.10', '8.11', '8.14',
              '9.1', '9.2', '9.3', '9.4', '9.5',
              '10.1', '10.2', '10.3', '10.4', '10.6', '10.7', '10.8',
              '11.1', '11.2', '11.3', '11.4', '11.5', '11.6', '11.7', '11.8', '11.9',
              '12.1', '12.2', '12.4', '12.5',
              '13.1', '13.2', '13.3', '13.4', '13.5', '13.6',
              '14.1', '14.2', '14.3', '14.4',
              '15.1', '15.3', '15.6', '15.7',
              '16.1', '16.2', '16.3', '16.4', '16.5', '16.6',
              '17.1', '17.2', '17.3', '17.5', '17.6', '17.7', '17.8',
              '18.1', '18.2', '18.3', '18.4', '18.5', '18.6', '18.7', '18.8',
              '19.1', '19.2',
              '20.1', '20.2', '20.3', '20.4', '20.6', '20.7', '20.8', '20.9', '20.13',
              '21.1', '21.2', '21.14', '21.18', '21.20',
              '22.1', '22.2',
              'dir-4.1', 'dir-4.2', 'dir-4.5', 'dir-4.7', 'dir-4.9', 'dir-4.11',
              'dir-4.12', 'dir-4.14'
          ]
          
          required_violations = []
          advisory_violations = []
          style_violations = []
          cppcheck_errors = []
          
          for error in errors:
              severity = error.get('severity', 'unknown')
              msg = error.get('msg', '')
              id_attr = error.get('id', '')
              file_attr = error.get('file', '')
              line_attr = error.get('line', '')
              
              # Check if it's a MISRA rule (both c2012 and c2023 naming)
              if 'misra' in id_attr.lower():
                  # Extract rule number from id (e.g., misra-c2023-10.1 or misra-c2012-10.1)
                  rule_num = id_attr.split('-')[-1] if '-' in id_attr else ''
                  is_required = rule_num in C2023_REQUIRED_RULES
                  
                  vio = {
                      'file': file_attr,
                      'line': line_attr,
                      'rule': id_attr,
                      'severity': severity,
                      'msg': msg
                  }
                  
                  if is_required:
                      required_violations.append(vio)
                  else:
                      advisory_violations.append(vio)
              elif severity in ('error', 'warning'):
                  cppcheck_errors.append({
                      'file': file_attr,
                      'line': line_attr,
                      'id': id_attr,
                      'msg': msg
                  })
          
          print(f"\n{'='*60}")
          print("MISRA C:2023 Analysis Results (Cppcheck)")
          print('='*60)
          print(f"Required Rule Violations: {len(required_violations)}")
          print(f"Advisory Rule Violations: {len(advisory_violations)}")
          print(f"Cppcheck Errors: {len(cppcheck_errors)}")
          print('='*60)
          
          if required_violations:
              print("\n❌ Required Rule Violations (MUST FIX or Document Deviation):")
              for v in required_violations[:15]:  # Show first 15
                  print(f"  {v['file']}:{v['line']} - {v['rule']}: {v['msg'][:80]}")
              if len(required_violations) > 15:
                  print(f"  ... and {len(required_violations) - 15} more")
          
          if advisory_violations:
              print(f"\n⚠️  Advisory Rule Violations: {len(advisory_violations)}")
              for v in advisory_violations[:10]:
                  print(f"  {v['file']}:{v['line']} - {v['rule']}: {v['msg'][:60]}")
              if len(advisory_violations) > 10:
                  print(f"  ... and {len(advisory_violations) - 10} more")
          
          # Write summary for GitHub Actions
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null').replace('/dev/null', 'cppcheck-summary.txt'), 'w') as f:
              f.write(f"required={len(required_violations)}\n")
              f.write(f"advisory={len(advisory_violations)}\n")
          
          # Exit with error if required violations found (production mode)
          # Note: In Phase 1 migration, fail_on_required is false until baseline is cleared
          if len(required_violations) > 0:
              print("\n❗ Required MISRA C:2023 violations found (documented deviation or fix needed)")
              # Exit 0 during migration phase to not block CI; switch to exit(1) when baseline cleared
              sys.exit(0)
          else:
              print("\n✅ No required MISRA C:2023 violations found!")
              sys.exit(0)
          EOF

      - name: Upload Cppcheck MISRA C:2023 Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-misra-c2023-report
          path: ${{ env.MISRA_REPORT_DIR }}/cppcheck-misra-c2023-report.xml

  # ============================================================================
  # Auto-fix Check (MISRA C:2023)
  # ============================================================================
  auto-fix:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.c_files != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download changed files list
        uses: actions/download-artifact@v4
        with:
          name: changed-files

      - name: Run Auto-fix Script (Dry-run) for MISRA C:2023
        run: |
          cat changed_files.txt | grep '\.c$' | while read f; do
            if [ -f "$f" ]; then echo "$f"; fi
          done > files_to_check.txt
          
          if [ -s files_to_check.txt ]; then
            echo "Running auto-fix dry-run (MISRA C:2023)..."
            python3 scripts/fix_misra_issues.py \
              --rules=20.7,17.7,c2023-11.9 \
              --dry-run \
              $(cat files_to_check.txt) \
              2>&1 | tee autofix-dryrun.txt || true
          fi

      - name: Comment PR with Auto-fix Suggestions
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let autofixOutput = '';
            try {
              autofixOutput = fs.readFileSync('autofix-dryrun.txt', 'utf8');
            } catch (e) {
              autofixOutput = 'No auto-fix suggestions available.';
            }
            
            const body = `## 🔧 MISRA C:2023 Auto-Fix Suggestions
            
            The following automatic fixes may be applicable to your changes:
            
            <details>
            <summary>Click to expand auto-fix report</summary>
            
            \`\`\`
            ${autofixOutput}
            \`\`\`
            </details>
            
            To apply fixes locally:
            \`\`\`bash
            python3 scripts/fix_misra_issues.py --rules=20.7,17.7,c2023-11.9 --apply <your-files>
            \`\`\`
            
            ---
            *This is an automated message from the MISRA C:2023 compliance checker.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # yuleOSH CI Integration (full project scan)
  # ============================================================================
  yuleosh-ci:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.c_files != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup yuleOSH
        run: |
          pip install yuleosh-ci 2>/dev/null || true
          # yuleOSH CI path if installed locally
          if [ -f ".yuleosh/yuleosh" ]; then
            chmod +x .yuleosh/yuleosh
          fi

      - name: Run yuleOSH MISRA Check
        run: |
          mkdir -p ${{ env.MISRA_REPORT_DIR }}
          
          # yuleOSH CI misra check reads from .yuleosh/ci-config.yaml
          # and .yuleosh/misra-addon-config.json
          yuleosh ci check misra \
            --profile safety \
            --output ${{ env.MISRA_REPORT_DIR }}/yuleosh-misra-report.json \
            2>&1 | tee ${{ env.MISRA_REPORT_DIR }}/yuleosh-misra-check.log || true

      - name: Upload yuleOSH Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuleosh-misra-report
          path: ${{ env.MISRA_REPORT_DIR }}/*.json

  # ============================================================================
  # Generate Summary Report
  # ============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [cppcheck, auto-fix]
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - name: Generate MISRA C:2023 Compliance Summary
        run: |
          cat << 'EOF' > ${{ env.MISRA_REPORT_DIR }}/compliance-summary.md
          # MISRA C:2023 Compliance Summary
          
          **Build:** ${{ github.run_number }}  
          **Commit:** ${{ github.sha }}  
          **Branch:** ${{ github.ref_name }}
          
          ## Results
          
          | Check | Status |
          |-------|--------|
          | Cppcheck C:2023 Analysis | ${{ needs.cppcheck.result }} |
          | Auto-fix Check | ${{ needs.auto-fix.result }} |
          | yuleOSH CI Integration | ${{ needs.yuleosh-ci.result }} |
          
          ## Migration Status
          
          - **From:** MISRA C:2012 → **To:** MISRA C:2023
          - **Migration Date:** $(date +%Y-%m-%d)
          - **Baseline Violations (C:2023):** 3266 total (369 required, 1020 advisory)
          - **Baseline Scan:** 2026-07-22 (commit fc0d857)
          
          ## Quick Links
          
          - [Full Audit Report](../../docs/compliance/MISRA_C2023_AUDIT.md)
          - [Deviation Permits](../../docs/compliance/deviation_permits_c2023.md)
          - [Rule Reference](../../tools/misra/misra_rules.json)
          - [Migration Report](../../docs/next-phase-plan.md)
          
          ## Next Steps
          
          If violations were found:
          1. Review detailed reports in artifacts
          2. Run locally: `yuleosh ci check misra --profile safety`
          3. Apply automatic fixes: `python3 scripts/fix_misra_issues.py --rules=20.7,17.7,c2023-11.9 --apply <files>`
          4. Document deviations in `docs/compliance/deviation_permits_c2023.md`
          5. See WP1 plan: `docs/next-phase-plan.md` for batch workflow
          EOF

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary
          path: ${{ env.MISRA_REPORT_DIR }}/compliance-summary.md

      - name: Comment PR with Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const cppcheckResult = '${{ needs.cppcheck.result }}';
            const autofixResult = '${{ needs.auto-fix.result }}';
            
            let statusEmoji = '✅';
            let statusMsg = 'All MISRA C:2023 checks passed!';
            
            if (cppcheckResult === 'failure') {
              statusEmoji = '❌';
              statusMsg = 'Required MISRA C:2023 violations found. Fix or document deviations.';
            }
            
            const body = `${statusEmoji} **MISRA C:2023 Compliance Check**
            
            ${statusMsg}
            
            | Check | Result |
            |-------|--------|
            | Cppcheck C:2023 Analysis | ${cppcheckResult === 'success' ? '✅ passed' : cppcheckResult === 'failure' ? '❌ failed' : '⚠️ skipped'} |
            | Auto-fix Check | ${autofixResult === 'success' ? '✅ passed' : autofixResult === 'failure' ? '❌ failed' : '⚠️ skipped'} |
            
            <details>
            <summary>How to fix</summary>
            
            Run locally:
            \`\`\`bash
            # Check specific files
            yuleosh ci check misra --profile safety --files src/your/file.c
            
            # Auto-fix simple issues
            python3 scripts/fix_misra_issues.py --rules=20.7,17.7,c2023-11.9 --apply src/your/file.c
            \`\`\`
            </details>
            
            ---
            *This is an automated message from the MISRA C:2023 compliance checker.*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('MISRA C:2023 Compliance Check')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================================================
  # PC-lint Check (Optional - requires license)
  # ============================================================================
  pclint:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.c_files != '' && vars.PCLINT_LICENSE != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for PC-lint license
        run: |
          if [ -z "${{ vars.PCLINT_LICENSE }}" ]; then
            echo "PC-lint license not configured. Skipping."
            exit 0
          fi

      - name: Run PC-lint Plus (MISRA C:2023)
        run: |
          echo "PC-lint Plus would run here with MISRA C:2023 profile"
          echo "This is a placeholder for the actual PC-lint analysis"
          # pclp64 tools/misra/pclint_config.lnt -vf <changed_files> --misra=2023

      - name: Upload PC-lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pclint-c2023-report
          path: ${{ env.MISRA_REPORT_DIR }}/pclint-c2023-report.txt
