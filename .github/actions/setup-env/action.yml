name: Setup Environment
description: 公共环境准备 — checkout + Python + 基础 apt 依赖

inputs:
  python-version:
    description: Python 版本
    required: false
    default: '3.10'
  pip-packages:
    description: 额外 pip 包（空格分隔）
    required: false
    default: ''
  apt-packages:
    description: 额外 apt 包（空格分隔）
    required: false
    default: ''
  fetch-depth:
    description: checkout fetch-depth
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install base apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev ${{ inputs.apt-packages }}
      shell: bash

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ${{ inputs.pip-packages }}
      shell: bash
