#=============================================================================
# openocd_s32k312.cfg — OpenOCD configuration for S32K312
#
# Usage:
#   openocd -f scripts/openocd_s32k312.cfg
#   openocd -f scripts/openocd_s32k312.cfg \
#     -c "program build/yuleasr.hex" \
#     -c "reset" -c "exit"
#=============================================================================

# Source: NXP S32K312 Reference Manual
# Debug interface: SWD (Serial Wire Debug)

# Interface and transport
source [find interface/cmsis-dap.cfg]
# Alternative: Uncomment below for JLink
# source [find interface/jlink.cfg]

# Transport: SWD
transport select swd

# Source the S32K312 target config
# Note: OpenOCD may not have built-in S32K312 support.
# Use the S32K3xx generic config or create a custom one.
#
# The S32K312 is ARM Cortex-M7 with:
#   - 2 MB Flash (dual bank)
#   - 512 KB SRAM
#   - 4 KB I-cache + 4 KB D-cache
#   - 8 KB TCM (Tightly Coupled Memory)

set CHIPNAME s32k312
set CPU_NAME s32k312.cpu

# Target configuration
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME s32k312
}

if { [info exists CPU_NAME] } {
    set _CPU_NAME $CPU_NAME
} else {
    set _CPU_NAME ${_CHIPNAME}.cpu
}

if { [info exists ENDIAN] } {
    set _ENDIAN $ENDIAN
} else {
    set _ENDIAN little
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000  # 32 KB work area
}

# Create target
set _TARGETNAME $_CHIPNAME.target

swj_newdap $_CHIPNAME cpu -expected-id 0x2BA01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN \
    -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE \
    -work-area-backup 1

# Flash configuration
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME s32k3xx 0x00400000 0 0 0 $_TARGETNAME

# Reset configuration
reset_config srst_nogate

# Halt on connect
$_TARGETNAME configure -event gdb-attach {
    echo "Debugger connected. Halting target..."
    halt
}

$_TARGETNAME configure -event reset-init {
    echo "Target reset. Initializing..."
    # Enable FPU
    arm mcr 15 0 1 0 2 0x40000000
}

# GDB configuration
gdb_breakpoint_override hard
gdb_report_register_during_step enable

echo "OpenOCD configured for S32K312 (Cortex-M7)"
echo "  Target: $CPU_NAME"
echo "  Flash:  0x00400000 (2 MB)"
echo "  SRAM:   0x20000000 (512 KB)"
echo "  Work area: [0x20000000, $_WORKAREASIZE bytes]"
echo "  Transport: SWD"
echo "  Debugger: CMSIS-DAP (or JLink if configured)"
